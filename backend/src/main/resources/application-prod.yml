spring:
  jpa.properties.hibernate.jdbc.time_zone: UTC
  lifecycle.timeout-per-shutdown-phase: 30s
  data.redis:
    username: ${REDIS_USERNAME:default}
    password: ${REDIS_PASSWORD}
    ssl.enabled: true
  kafka:
    listener.missing-topics-fatal: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}
      ssl.endpoint.identification.algorithm: https
logging.level.root: INFO
eventpass.jwt.secret: ${JWT_SECRET}
eventpass.security.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
eventpass.kafka.topics.replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:3}
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
