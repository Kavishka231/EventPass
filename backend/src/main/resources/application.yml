spring:
  application.name: eventpass
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eventpass}
    username: ${DATABASE_USERNAME:eventpass}
    password: ${DATABASE_PASSWORD:eventpass}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  data.web.pageable:
    default-page-size: 20
    max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:eventpass-notifications-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
        isolation.level: read_committed
    producer:
      acks: all
      retries: 2147483647
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      missing-topics-fatal: false
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
  jackson:
    default-property-inclusion: non_null
server:
  shutdown: graceful
  error.include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: when_authorized
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
eventpass:
  security.cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production}
    access-ttl: PT15M
    refresh-ttl: P30D
    issuer: ${JWT_ISSUER:eventpass}
    audience: ${JWT_AUDIENCE:eventpass-api}
    signing-key-id: ${JWT_SIGNING_KEY_ID:eventpass-primary}
  booking.hold-ttl: PT5M
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    publish-delay: PT2S
  kafka:
    provisioning-enabled: ${KAFKA_TOPIC_PROVISIONING_ENABLED:true}
    topics:
      partitions: ${KAFKA_TOPIC_PARTITIONS:6}
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
      retention: ${KAFKA_TOPIC_RETENTION_MS:604800000}
      dlt-retention: ${KAFKA_DLT_RETENTION_MS:2592000000}
springdoc.swagger-ui.path: /swagger-ui.html
