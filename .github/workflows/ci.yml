name: backend-ci
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate operations scripts
        run: |
          for script in ops/postgres/*.sh; do
            sh -n "$script"
          done
      - name: Verify backend
        working-directory: backend
        run: mvn -B spotless:check verify
      - name: Build backend image
        run: docker build -t eventpass-backend:${{ github.sha }} backend
